# hyprpaper.conf
# NOTE: hyprpaper's config still uses the classic block syntax (not Lua) since it's a
# separate tool from Hyprland core.
#
# Monitor is left empty so this applies as a fallback to ALL monitors, regardless of
# connector name — your port names have been changing between boots
# (HDMI-A-1 -> HDMI-A-2, DP-1 -> DP-4, DP-2 -> DP-5), so pinning to a specific name
# would just break again. desc: matching isn't reliably supported by hyprpaper either.

wallpaper {
    monitor = 
    path = ~/Pictures/wallpapers/wallpaper.jpg
    fit_mode = cover
}
